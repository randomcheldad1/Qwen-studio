name: Focused Python tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [test_workspace_tools.py, test_chat.py, test_both_chats.py, test_desktop_guards.py, test_sftp_integration.py, test_sftp_panel.py]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p '${{ matrix.module }}' -v
