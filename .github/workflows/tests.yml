name: Focused Python tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [test_workspace_tools.py, test_chat.py, test_both_chats.py, test_desktop_guards.py, test_sftp_integration.py, test_sftp_panel.py]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: python -m pip install -r requirements.txt
      - name: Run focused tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p '${{ matrix.module }}' -v > test-results.txt 2>&1
          result=$?
          cat test-results.txt
          if [ "$result" -ne 0 ]; then
            python -c 'from pathlib import Path; text="\n".join(Path("test-results.txt").read_text().splitlines()[-20:]); print("::error::"+text.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          fi
          exit "$result"
